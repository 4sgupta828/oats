apiVersion: batch/v1
kind: Job
metadata:
  name: oats-database-init
  labels:
    app: oats-database-init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: oats-database-init
    spec:
      restartPolicy: Never
      serviceAccountName: oats-backend
      containers:
      - name: database-init
        image: 911167909198.dkr.ecr.us-west-2.amazonaws.com/oats-backend-api:latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Starting database initialization..."
          cd /app
          python3 database/init_db.py
          echo "Database initialization complete!"
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: url
        - name: PYTHONPATH
          value: "/app"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
