apiVersion: apps/v1
kind: Deployment
metadata:
  name: oats-backend-api
  labels:
    app: oats-backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oats-backend-api
  template:
    metadata:
      labels:
        app: oats-backend-api
    spec:
      serviceAccountName: oats-backend
      containers:
        - name: backend-api
          image: oats-backend-api:v99
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # LLM Provider (claude is default in config.py)
            - name: UFFLOW_LLM_PROVIDER
              value: "claude"
            # API keys for the embedded agent
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: oats-api-keys
                  key: anthropic-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: oats-api-keys
                  key: openai-api-key
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oats-api-keys
                  key: github-token