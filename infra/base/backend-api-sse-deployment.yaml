apiVersion: apps/v1
kind: Deployment
metadata:
  name: oats-backend-api-sse
  labels:
    app: oats-backend-api-sse
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oats-backend-api-sse
  template:
    metadata:
      labels:
        app: oats-backend-api-sse
        version: "2.0.0"
    spec:
      serviceAccountName: oats-backend
      containers:
      - name: backend-api-sse
        image: oats-backend-api-sse:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-credentials
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-credentials
              key: anthropic-api-key
        - name: UFFLOW_LLM_PROVIDER
          value: "anthropic"
        - name: PYTHONPATH
          value: "/app"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: oats-config
---
apiVersion: v1
kind: Service
metadata:
  name: oats-backend-api-sse
  labels:
    app: oats-backend-api-sse
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: oats-backend-api-sse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-config
data:
  host: "postgres-service"
  port: "5432"
  database: "oats"
  user: "oats_user"
---
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
type: Opaque
data:
  # Base64 encoded database URL
  # Example: postgresql://oats_user:password@postgres-service:5432/oats
  url: cG9zdGdyZXNxbDovL29hdHNfdXNlcjpwYXNzd29yZEBwb3N0Z3Jlcy1zZXJ2aWNlOjU0MzIvb2F0cw==
