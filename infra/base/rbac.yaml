# NOTE: The agent is now embedded in the backend service.
# These RBAC permissions provide minimal access for the backend API.
# Extended permissions for pod/job creation have been removed.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: oats-backend
---
# Minimal permissions for backend API service
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oats-backend-role
rules:
  # Read access to pods for monitoring/status
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oats-backend-binding
subjects:
  - kind: ServiceAccount
    name: oats-backend
roleRef:
  kind: Role
  name: oats-backend-role
  apiGroup: rbac.authorization.k8s.io